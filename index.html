<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMP Builders — Invoice</title>
<style>
  :root {
    --navy: #0A2540;
    --gold: #AC7432;
    --light-gold: #F3E4CF;
    --cream: #FBF9F5;
    --grey-text: #5b5b5b;
    --line: #E4DCC9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #E9E4D8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: var(--navy);
    display: flex;
    justify-content: center;
    padding: 18px 0 60px;
  }
  .phone {
    width: 100%;
    max-width: 420px;
    background: var(--cream);
    min-height: 100vh;
    box-shadow: 0 0 24px rgba(0,0,0,0.12);
  }
  header {
    padding: 22px 20px 14px;
    text-align: center;
    border-bottom: 3px solid var(--gold);
  }
  header img { width: 120px; display: block; margin: 0 auto 6px; }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    letter-spacing: 1px;
    margin: 4px 0 0;
    color: var(--navy);
  }
  .meta {
    padding: 14px 20px 6px;
    font-size: 13px;
  }
  .meta label {
    display: block;
    color: var(--grey-text);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .meta input {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    font-size: 15px;
    color: #1155CC;
    padding: 4px 0 8px;
    font-family: inherit;
  }
  .meta .row2 {
    display: flex;
    gap: 14px;
    margin-top: 8px;
  }
  .meta .row2 div { flex: 1; }

  .day-list { padding: 16px 14px 4px; }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    position: relative;
  }
  .card .remove {
    position: absolute;
    top: 8px;
    right: 10px;
    border: none;
    background: none;
    color: #b7a98f;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
  }
  .field { margin-bottom: 10px; }
  .field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--grey-text);
    font-weight: 700;
    margin-bottom: 3px;
  }
  .field select,
  .field input[type=text] {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 15px;
    color: #1155CC;
    background: #fdfcfa;
    font-family: inherit;
  }
  .daytype-toggle {
    display: flex;
    gap: 8px;
  }
  .daytype-toggle button {
    flex: 1;
    padding: 12px 6px;
    border-radius: 8px;
    border: 1.5px solid var(--gold);
    background: #fff;
    color: var(--navy);
    font-weight: 700;
    font-size: 13.5px;
    font-family: inherit;
    cursor: pointer;
  }
  .daytype-toggle button.active {
    background: var(--gold);
    color: #fff;
  }
  .card-cost {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
  }
  .card-cost .val { font-size: 17px; color: var(--navy); }

  .add-day {
    display: block;
    width: calc(100% - 28px);
    margin: 4px 14px 18px;
    padding: 13px;
    border: 1.5px dashed var(--gold);
    background: transparent;
    color: var(--gold);
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }

  .total-bar {
    margin: 0 14px 16px;
    background: var(--navy);
    color: #fff;
    border-radius: 10px;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .total-bar .label {
    font-family: Georgia, serif;
    font-size: 15px;
    letter-spacing: 0.3px;
  }
  .total-bar .amount {
    font-size: 22px;
    font-weight: 700;
    color: var(--light-gold);
  }

  .comments {
    margin: 0 14px 16px;
  }
  .comments label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--grey-text);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .comments textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
    min-height: 50px;
  }

  .export-btn {
    display: block;
    width: calc(100% - 28px);
    margin: 4px 14px 6px;
    padding: 15px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 0.3px;
    cursor: pointer;
  }
  .export-btn:active { opacity: 0.85; }
  .export-hint {
    text-align: center;
    font-size: 11.5px;
    color: var(--grey-text);
    margin: 0 20px 18px;
    line-height: 1.4;
  }
  .new-week-btn {
    display: block;
    width: calc(100% - 28px);
    margin: 0 14px 24px;
    padding: 11px;
    background: transparent;
    color: #a33;
    border: 1px solid #d9b8b8;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }

  .pdf-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #2b2b2b;
    z-index: 1000;
    flex-direction: column;
  }
  .pdf-modal.open { display: flex; }
  .pdf-modal-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    background: var(--navy);
    color: #fff;
    flex-shrink: 0;
  }
  .pdf-modal-title { font-weight: 700; font-size: 14px; }
  .pdf-modal-actions { display: flex; gap: 8px; }
  .pdf-modal-actions button {
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  #pdfSaveBtn { background: var(--gold); color: #fff; }
  #pdfCloseBtn { background: rgba(255,255,255,0.15); color: #fff; }
  .pdf-modal-body {
    flex: 1;
    overflow: auto;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  #pdfCanvas {
    max-width: 100%;
    height: auto;
    background: #fff;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
  }
</style>
<script src="jspdf.umd.min.js"></script>
<script src="jspdf.plugin.autotable.min.js"></script>
<script src="pdf.min.js"></script>

</head>

<template id="cardTemplate">
  <div class="card">

    <div class="field">
      <label>Company</label>
      <input type="text" class="f-company" placeholder="e.g. Pella">
    </div>

    var cards = dayList.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      total += parseFloat(cards[i].getAttribute('data-amount') || 0);
    }
    totalAmountEl.textContent = formatCurrency(total);
  }

  function saveState() {
    if (isRestoring) return;
    try {
      var cards = dayList.querySelectorAll('.card');
      var data = [];
      for (var i = 0; i < cards.length; i++) {
        var card = cards[i];
        var activeBtn = card.querySelector('.dt-btn.active');
        data.push({
          day: card.querySelector('.f-day').value,
          client: card.querySelector('.f-client').value,
          job: card.querySelector('.f-job').value,
          company: card.querySelector('.f-company').value,
          workers: card.querySelector('.f-workers').value,
          dayType: activeBtn ? activeBtn.getAttribute('data-val') : ''
        });
      }
      var state = {
        weekStarting: document.getElementById('weekStarting').value,
        comments: document.getElementById('commentsBox').value,
        cards: data
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* storage unavailable — form still works, just won't persist */ }
  }

  function addCard(prefill) {
    var node = template.content.cloneNode(true);
    var card = node.querySelector('.card');
    card.setAttribute('data-amount', 0);

    card.querySelector('.remove').addEventListener('click', function () {
      card.parentNode.removeChild(card);
      updateTotal();
      saveState();
    });

    function selectDayType(btn) {
      var siblings = card.querySelectorAll('.dt-btn');
      for (var j = 0; j < siblings.length; j++) { siblings[j].classList.remove('active'); }
      btn.classList.add('active');
      var amt = parseFloat(btn.getAttribute('data-amt'));
      card.setAttribute('data-amount', amt);
      card.querySelector('.f-cost').textContent = formatCurrency(amt);
      updateTotal();
      saveState();
    }

    var dtBtns = card.querySelectorAll('.dt-btn');
    for (var i = 0; i < dtBtns.length; i++) {
      (function (btn) {
        btn.addEventListener('click', function () { selectDayType(btn); });
      })(dtBtns[i]);
    }

    var textFields = card.querySelectorAll('.f-day, .f-client, .f-job, .f-company, .f-workers');
    for (var t = 0; t < textFields.length; t++) {
      textFields[t].addEventListener('input', saveState);
      textFields[t].addEventListener('change', saveState);
    }

    var targetBtn = null;
    if (prefill) {
      card.querySelector('.f-day').value = prefill.day;
      card.querySelector('.f-client').value = prefill.client;
      card.querySelector('.f-job').value = prefill.job;
      card.querySelector('.f-company').value = prefill.company;
      card.querySelector('.f-workers').value = prefill.workers;
      var allBtns = card.querySelectorAll('.dt-btn');
      for (var k = 0; k < allBtns.length; k++) {
        if (allBtns[k].getAttribute('data-val') === prefill.dayType) { targetBtn = allBtns[k]; }
      }
    }

    dayList.appendChild(card);

    if (targetBtn) {
      selectDayType(targetBtn);
    }
  }

  document.getElementById('addDayBtn').addEventListener('click', function () {
    addCard();
    saveState();
  });

  document.getElementById('weekStarting').addEventListener('change', saveState);
  document.getElementById('commentsBox').addEventListener('input', saveState);

  function collectRows() {
    var rows = [];
    var total = 0;
    var cards = dayList.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var activeBtn = card.querySelector('.dt-btn.active');
      var amt = parseFloat(card.getAttribute('data-amount') || 0);
      total += amt;
      rows.push({
        day: card.querySelector('.f-day').value,
        client: card.querySelector('.f-client').value,
        job: card.querySelector('.f-job').value,
        company: card.querySelector('.f-company').value,
        workers: card.querySelector('.f-workers').value,
        dayType: activeBtn ? activeBtn.getAttribute('data-val') : '',
        cost: amt
      });
    }
    return { rows: rows, total: total };
  }

  async function generateAndDeliverPDF() {
    var exportBtn = document.getElementById('exportBtn');
    var hint = document.getElementById('exportHint');
    exportBtn.disabled = true;
    var originalLabel = exportBtn.textContent;
    hint.textContent = DEFAULT_EXPORT_HINT;
    exportBtn.textContent = 'Preparing PDF…';

    try {
      var data = collectRows();
      var weekVal = document.getElementById('weekStarting').value || '(not set)';
      var companyId = document.getElementById('companyId').value;
      var orgName = document.getElementById('orgName').value;
      var comments = document.getElementById('commentsBox').value || '(none)';

      if (!window.jspdf || !window.jspdf.jsPDF) {
        throw new Error('PDF library did not load (no internet, or scripts blocked). Please check your connection and try again.');
      }
      var jsPDFLib = window.jspdf.jsPDF;
      var doc = new jsPDFLib({ unit: 'pt', format: 'letter' });

      var logoImg = document.querySelector('header img');
      if (logoImg && logoImg.src) {
        try { doc.addImage(logoImg.src, 'PNG', 40, 30, 60, 40); } catch (e) {}
      }

      doc.setFont('times', 'bold');
      doc.setFontSize(16);
      doc.setTextColor(10, 37, 64);
      doc.text('WEEKLY PAYROLL \u2014 JMP BUILDERS LLC', 110, 52);

      doc.setDrawColor(172, 116, 50);
      doc.setLineWidth(2);
      doc.line(40, 78, 572, 78);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.setTextColor(60, 60, 60);
      doc.text('Week Starting: ' + weekVal, 40, 94);
      doc.text('Company ID: ' + companyId, 230, 94);
      doc.text('Organization: ' + orgName, 380, 94);

      var body = data.rows.map(function (r) {
        return [r.day, r.client, r.job, r.company, r.workers, r.dayType, formatCurrency(r.cost)];
      });

      if (typeof doc.autoTable !== 'function') {
        throw new Error('PDF table plugin did not load. Please check your connection and try again.');
      }
      doc.autoTable({
        startY: 106,
        head: [['Day', 'Client / Project', 'Job #', 'Company', 'Workers', 'Day Type', 'Cost']],
        body: body,
        theme: 'grid',
        styles: { fontSize: 9, cellPadding: 5, textColor: [10, 37, 64] },
        headStyles: { fillColor: [10, 37, 64], textColor: 255, fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [248, 244, 236] },
        columnStyles: { 6: { halign: 'right' } },
        foot: [['', '', '', '', '', 'TOTAL DUE', formatCurrency(data.total)]],
        footStyles: { fillColor: [243, 228, 207], textColor: [10, 37, 64], fontStyle: 'bold', fontSize: 10 }
      });

      var finalY = doc.lastAutoTable.finalY + 24;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9.5);
      doc.setTextColor(90, 90, 90);
      doc.text('Comments:', 40, finalY);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(30, 30, 30);
      doc.text(comments, 40, finalY + 14, { maxWidth: 530 });

      var blob = doc.output('blob');
      var safeWeek = weekVal.replace(/[^0-9A-Za-z-]/g, '') || 'week';
      var filename = 'JMP-Invoice-' + safeWeek + '.pdf';

      currentPdfBlob = blob;
      currentPdfFilename = filename;

      // Show the modal FIRST so its container has real dimensions to measure —
      // an element with display:none reports zero width, which broke the
      // scale calculation before.
      document.getElementById('pdfModal').classList.add('open');
      await renderPdfPreview(blob);
    } catch (e) {
      var msg = (e && e.message) ? e.message : String(e);
      hint.textContent = 'PDF export failed: ' + msg;
    } finally {
      exportBtn.disabled = false;
      exportBtn.textContent = originalLabel;
    }
  }

  var currentPdfBlob = null;
  var currentPdfFilename = 'JMP-Invoice.pdf';

  // Renders page 1 of the PDF onto a <canvas> using PDF.js — this draws the
  // page as pixels ourselves, so it looks identical on every browser/OS
  // instead of depending on whichever native PDF viewer (or lack of one)
  // the device happens to have for blob: URLs in an iframe.
  async function renderPdfPreview(blob) {
    var canvas = document.getElementById('pdfCanvas');
    var arrayBuffer = await blob.arrayBuffer();
    var loadingTask = window.pdfjsLib.getDocument({ data: arrayBuffer });
    var pdf = await loadingTask.promise;
    var page = await pdf.getPage(1);

    var containerWidth = document.getElementById('pdfModalBody').clientWidth - 32;
    var baseViewport = page.getViewport({ scale: 1 });
    var scale = Math.min(2.5, (containerWidth / baseViewport.width) || 1.5);
    var viewport = page.getViewport({ scale: scale });

    canvas.width = viewport.width;
    canvas.height = viewport.height;
    var ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
  }

  function closePdfModal() {
    document.getElementById('pdfModal').classList.remove('open');
  }

  document.getElementById('pdfCloseBtn').addEventListener('click', closePdfModal);

  document.getElementById('pdfSaveBtn').addEventListener('click', async function () {
    if (!currentPdfBlob) return;
    var saveBtn = document.getElementById('pdfSaveBtn');
    var originalSaveLabel = saveBtn.textContent;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    try {
      var file = new File([currentPdfBlob], currentPdfFilename, { type: 'application/pdf' });

      // Primary (iOS/Android): hand the file to the OS's native Share Sheet —
      // Save to Files, Messages, AirDrop, Mail, etc.
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: currentPdfFilename });
          return;
        } catch (shareErr) {
          if (shareErr && shareErr.name === 'AbortError') { return; } // user cancelled
        }
      }

      // Fallback (desktop browsers without file-share support): plain download.
      var url = URL.createObjectURL(currentPdfBlob);
      var link = document.createElement('a');
      link.href = url;
      link.download = currentPdfFilename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = originalSaveLabel;
    }
  });

  document.getElementById('exportBtn').addEventListener('click', function () {
    generateAndDeliverPDF();
  });

  var confirmingNewWeek = false;
  var confirmTimeout = null;
  var newWeekBtn = document.getElementById('newWeekBtn');
  var newWeekOriginalLabel = newWeekBtn.textContent;

  newWeekBtn.addEventListener('click', function () {
    if (!confirmingNewWeek) {
      confirmingNewWeek = true;
      newWeekBtn.textContent = 'Tap again to confirm — this clears everything';
      confirmTimeout = setTimeout(function () {
        confirmingNewWeek = false;
        newWeekBtn.textContent = newWeekOriginalLabel;
      }, 4000);
      return;
    }

    clearTimeout(confirmTimeout);
    confirmingNewWeek = false;
    newWeekBtn.textContent = newWeekOriginalLabel;

    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    dayList.innerHTML = '';
    document.getElementById('commentsBox').value = '';
    addCard();
    setDefaultDate();
    updateTotal();
  });

  function setDefaultDate(){
    var d = new Date();
    var day = d.getDay();
    var diff = (day === 1) ? 0 : (8 - day) % 7;
    d.setDate(d.getDate() + diff);
    document.getElementById('weekStarting').value = d.toISOString().slice(0,10);
  }

  // ---- Restore saved state on load, or seed an example on first-ever use ----
  (function init() {
    var saved = null;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) saved = JSON.parse(raw);
    } catch (e) { saved = null; }

    if (saved && saved.cards && saved.cards.length) {
      isRestoring = true;
      document.getElementById('weekStarting').value = saved.weekStarting || '';
      document.getElementById('commentsBox').value = saved.comments || '';
      for (var i = 0; i < saved.cards.length; i++) {
        addCard(saved.cards[i]);
      }
      isRestoring = false;
      updateTotal();
      if (!saved.weekStarting) setDefaultDate();
    } else {
      addCard();
      setDefaultDate();
      saveState();
    }
  })();
</script>
</body>
</html>
